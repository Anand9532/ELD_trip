# Render Blueprint — deploy backend from monorepo root directory on Render.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn eld_project.wsgi:application -c gunicorn.conf.py
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eld-trip-planner-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"

databases:
  - name: eld-trip-planner-db
    plan: free
    databaseName: eld
    user: eld
